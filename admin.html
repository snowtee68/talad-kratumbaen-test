<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#b31217">
  <title>Admin Center | กระทุ่มแบนไปด้วยกัน</title>
  <style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#111827}.card{max-width:420px;margin:20px;padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 14px 36px rgba(15,23,42,.08)}p{color:#6b7280}</style>
</head>
<body>
  <div class="card"><b>Admin Center</b><p>กำลังเปิดศูนย์ควบคุมผู้ดูแล...</p></div>
  <script>
  (function(){
    var src=new URL(window.location.href);
    var target=new URL('./',src);
    target.searchParams.set('admin_center','1');
    var view=src.searchParams.get('view');
    if(view)target.searchParams.set('admin_view',view);
    window.location.replace(target.href);
  })();
  </script>
</body>
</html>
